name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: deno test --allow-env --frozen supabase/functions/artifact-approvals/index.test.ts supabase/functions/artifact-approvals/requestChanges.test.ts
      - run: deno check --frozen supabase/functions/artifact-approvals/index.ts supabase/functions/artifact-approvals/index.test.ts supabase/functions/artifact-approvals/requestChanges.test.ts
      - run: deno test --frozen supabase/functions/ai-chat/index.test.ts supabase/functions/google-oauth/index.test.ts supabase/functions/meta-oauth/index.test.ts supabase/functions/content-studio/index.test.ts supabase/functions/department-chat/index.test.ts supabase/functions/proofing-layer/index.test.ts supabase/functions/artifact-relations/index.test.ts supabase/functions/development-studio/index.test.ts supabase/functions/work-items/index.test.ts supabase/functions/recurring-plans/index.test.ts supabase/functions/design-workshop/index.test.ts supabase/functions/design-workshop/identityReferences.test.ts supabase/functions/design-workshop/assetArchive.test.ts supabase/functions/design-systems/index.test.ts supabase/functions/website-page-designs/index.test.ts supabase/functions/wordpress-export/index.test.ts supabase/functions/production-handoff/index.test.ts supabase/functions/marketing-studio/index.test.ts supabase/functions/marketing-studio/reportMetricPins.test.ts supabase/functions/external-events/index.test.ts supabase/functions/technical-seo/index.test.ts supabase/functions/quick-tasks/index.test.ts supabase/functions/recurring-plans/schedule.test.ts supabase/functions/recurring-scheduler/index.test.ts
      - run: deno check --frozen supabase/functions/ai-chat/index.ts supabase/functions/ai-chat/index.test.ts supabase/functions/google-oauth/index.ts supabase/functions/google-oauth/index.test.ts supabase/functions/meta-oauth/index.ts supabase/functions/meta-oauth/index.test.ts supabase/functions/content-studio/index.ts supabase/functions/content-studio/index.test.ts supabase/functions/department-chat/index.ts supabase/functions/department-chat/index.test.ts supabase/functions/proofing-layer/index.ts supabase/functions/proofing-layer/index.test.ts supabase/functions/artifact-relations/index.ts supabase/functions/artifact-relations/index.test.ts supabase/functions/development-studio/index.ts supabase/functions/development-studio/index.test.ts supabase/functions/work-items/index.ts supabase/functions/work-items/index.test.ts supabase/functions/recurring-plans/index.ts supabase/functions/recurring-plans/index.test.ts supabase/functions/design-workshop/index.ts supabase/functions/design-workshop/index.test.ts supabase/functions/design-workshop/identityReferences.test.ts supabase/functions/design-workshop/assetArchive.test.ts supabase/functions/design-systems/index.ts supabase/functions/design-systems/index.test.ts supabase/functions/website-page-designs/index.ts supabase/functions/website-page-designs/index.test.ts supabase/functions/wordpress-export/index.ts supabase/functions/wordpress-export/index.test.ts supabase/functions/production-handoff/index.ts supabase/functions/production-handoff/index.test.ts supabase/functions/marketing-studio/index.ts supabase/functions/marketing-studio/index.test.ts supabase/functions/marketing-studio/reportMetricPins.test.ts supabase/functions/external-events/index.ts supabase/functions/external-events/index.test.ts supabase/functions/technical-seo/index.ts supabase/functions/technical-seo/index.test.ts supabase/functions/quick-tasks/index.ts supabase/functions/quick-tasks/index.test.ts supabase/functions/recurring-plans/schedule.ts supabase/functions/recurring-plans/schedule.test.ts supabase/functions/recurring-scheduler/index.ts supabase/functions/recurring-scheduler/index.test.ts
      - run: deno test --frozen supabase/functions/integration-gateway/index.test.ts
      - run: deno check --frozen supabase/functions/integration-gateway/index.ts supabase/functions/integration-gateway/index.test.ts
      - run: deno check --frozen supabase/functions/invite-user/index.ts supabase/functions/invite-client-contact/index.ts supabase/functions/portal-file-url/index.ts
      - run: deno test --frozen supabase/functions/pipeline-ai-runner/index.test.ts supabase/functions/_shared/n6PipelineCost.test.mjs supabase/functions/_shared/n6PipelineFallback.test.mjs
      - run: deno check --frozen supabase/functions/pipeline-ai-runner/index.ts supabase/functions/pipeline-ai-runner/index.test.ts supabase/functions/_shared/n6PipelineCost.ts supabase/functions/_shared/n6PipelineFallback.ts
      - run: npm run build
