name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: deno test --frozen supabase/functions/ai-chat/index.test.ts
      - run: deno check --frozen supabase/functions/ai-chat/index.ts supabase/functions/ai-chat/index.test.ts
      - run: npm run build
